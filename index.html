<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="欢迎来到我的个人主页，分享生活与灵感。">
<title>我的个人主页</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#243149;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.page{max-width:1080px;margin:auto;padding:0 32px;min-height:100svh;display:flex;flex-direction:column}header{padding:30px 0;border-bottom:1px solid #e0e4e7;display:flex;align-items:center;gap:12px;font-weight:650}.mark{background:#2463eb;color:white;border-radius:9px;padding:5px 10px;font-size:23px}main{flex:1;display:grid;grid-template-columns:1.4fr 1fr;align-items:center;gap:40px;padding:75px 0}.hello{color:#2463eb;font-size:13px;letter-spacing:2px}h1{font-size:clamp(36px,5vw,56px);line-height:1.45;letter-spacing:-1px;margin:20px 0}h1 span{color:#2463eb}.intro{font-size:17px;line-height:1.95;color:#647185;max-width:470px;margin-bottom:30px}button{font:inherit;background:#2463eb;color:#fff;border:0;border-radius:9px;padding:16px 24px;cursor:pointer;display:inline-flex;gap:30px;align-items:center}button:hover{background:#174fc9}button:focus-visible{outline:3px solid #89acff;outline-offset:4px}.details{color:#647185;line-height:1.9;border-left:2px solid #a8c2ff;padding-left:16px;margin-top:24px}.art{display:grid;place-items:center;min-height:350px;position:relative}.orb{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 28% 22%,#edf4ff,#a7c8ff 42%,#5087eb 75%,#285abd);box-shadow:0 30px 50px #3464b21a;position:relative}.orb:before{content:"";position:absolute;inset:32px -34px;border:1px solid #87a8de;border-radius:50%;transform:rotate(-35deg)}.orb:after{content:"✦";color:white;font-size:48px;position:absolute;top:62px;left:100px}.caption{position:absolute;bottom:0;font-size:12px;color:#71829a;letter-spacing:3px}footer{padding:26px 0;border-top:1px solid #e0e4e7;font-size:12px;color:#758297;display:flex;justify-content:space-between;gap:15px}@media(max-width:700px){.page{padding:0 24px}main{grid-template-columns:1fr;padding:45px 0;gap:30px}.art{min-height:270px}.orb{width:200px;height:200px}.orb:after{top:45px;left:74px;font-size:40px}h1{font-size:37px}.intro{font-size:16px}footer{font-size:11px;line-height:1.7}}
</style>
</head>
<body>
<div class="page">
<header><span class="mark" aria-hidden="true">✦</span>我的个人主页</header>
<main>
<section aria-labelledby="welcome">
<p class="hello">很高兴在这里遇见你</p>
<h1 id="welcome">你好，<br>欢迎来到<span>我的主页。</span></h1>
<!-- 示例个人介绍，可替换为自己的信息。 -->
<p class="intro">我是一个热爱生活、保持好奇的人。喜欢学习新事物，也喜欢记录日常里的小小灵感。这里是我的一方小天地，与你分享所思、所学与所爱。</p>
<button id="more" type="button" aria-expanded="false" aria-controls="about">了解更多 <span aria-hidden="true">↗</span></button>
<p id="about" class="details" hidden>对我而言，成长来自每一次尝试，灵感藏在每一个平凡的日子里。希望在这里，与你一起探索更多可能。</p>
</section>
<div class="art" aria-hidden="true"><div class="orb"></div><span class="caption">保持好奇，慢慢生长。</span></div>
</main>
<footer><span>© 2026 我的个人主页</span><span>把日常，过成喜欢的模样。</span></footer>
</div>
<script>
const button=document.getElementById('more');
button.addEventListener('click',()=>{const expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!expanded));document.getElementById('about').hidden=expanded;button.innerHTML=expanded?'了解更多 <span aria-hidden="true">↗</span>':'收起介绍 <span aria-hidden="true">↑</span>';});
</script>
</body>
</html>
